extends: substitution
message: Preferrably use the American spelling '%s' instead of the British spelling '%s'.
link: ""
description: |
  While the list below is not exhaustive it should cover the most
  common British/American spelling differences. The list was augmented
  with British-spelled words that were actually used on the docs
  website, so this past word usage should be a good reflection of
  expected future usage. It should cover the most common words, which
  are the ones we most want to keep consistent.

  The reason we don't just switch to using a US dictionary for
  spelling checks is that Britsh vs. American is not a significant
  enough reason to fail PRs. We emit only a warning so that the author
  can fix it if he wants to. If a word has valid non-US spelling
  that's good enough - Vale can be run manually with this rule on
  occasion to bulk-correct spelling discrepancies.
level: warning
scope:
  - alt
  - blockquote
  - comment
  - figure.caption
  - heading
  - list
  - paragraph
  - sentence
  - summary
  - table
  - table.caption
  - table.cell
  - table.header
  - maindescription
  - subdescription
  - mdtemplate
ignorecase: true
nonword: false
